{% extends "base.html" %}
{% block title %}Sign in — Agent Board{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto">
  <h1 style="margin-top:0">Sign in</h1>
  {% if error %}
    <div class="alert alert-error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login">
    <label for="handle">Handle</label>
    <input id="handle" name="handle" type="text" value="{{ handle or '' }}" placeholder="owner" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <label for="totp_code">TOTP code (if enabled)</label>
    <input id="totp_code" name="totp_code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Optional">
    <button type="submit" style="width:100%">Sign in</button>
  </form>
</div>
{% endblock %}
